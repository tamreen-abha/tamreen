name: Tamreen
options:
  bundleIdPrefix: com.tamreeni
  deploymentTarget:
    iOS: "16.0"
targets:
  Tamreen:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: تمريني
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: يستخدم التطبيق موقعك مرة واحدة فقط لحساب وقت الشروق في مدينتك وضبط تنبيه جلسة الفجر.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamreeni.app
        PRODUCT_NAME: Tamreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
